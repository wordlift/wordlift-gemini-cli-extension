name: Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create release archive
        run: |
          mkdir -p release
          tar \
            --exclude=".github" \
            --exclude=".release" \
            -czf release/wordlift-gemini-extension.tar.gz .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/wordlift-gemini-extension.tar.gz